# AME-AI-Review-System プロジェクト定義 ＋ ツール設定。
#
# パッケージは PyPI に公開しない（ソースコードコピー方式で配布）。そのためビルド
# バックエンド・entry point・extras は持たず、本ファイルはツール設定の正本として運用する。
# 開発用の SDK 依存は requirements-dev.txt で管理する。
# 静的解析ツール設定は後半に保持。厳格度: ruff ALL + preview + mypy strict で運用。

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "ame-ai-review-system"
version = "0"
description = "Dual-gate (pre-commit + PR) AI code review system with SDK-backed LLM engines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tarmin Japan" }]
keywords = ["code-review", "pre-commit", "llm", "claude", "opencode", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tarminjapan/AME-AI-Review-System"
Repository = "https://github.com/tarminjapan/AME-AI-Review-System"
Issues = "https://github.com/tarminjapan/AME-AI-Review-System/issues"

# ---------------------------------------------------------------------------
# Ruff: lint + format（超厳格）
# ---------------------------------------------------------------------------
# Ruff: lint + format（超厳格）
#   方針: 全ルール(ALL)を有効化。preview ルールも有効化する。
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = [
    "ame_ai_review_system",
    "scripts",
]
# 抑制コメント検出スクリプトは # noqa / # ruff: noqa パターンを
# データとして保持するため、ruff のチェック・フォーマット対象外とする。
extend-exclude = [
    "scripts/precommit_hygiene.py",
]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    # 著作権表示はプロジェクト慣習なし。
    "missing-copyright-notice",
    # COM812 は ruff format と競合するため無効化 (formatter 側でカンマを制御)。
    "missing-trailing-comma",
    # Return/yield/例外をすべてdocstringに書くことは要求しない。
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception",
    # ドメインロジックの大関数（分割はスコープ外）。
    "complex-structure", "too-many-branches", "too-many-locals", "too-many-statements", "too-many-return-statements", "too-many-arguments", "too-many-positional-arguments",
    # tryブロック内の文数制限。
    "too-many-statements-in-try-clause",
    # subprocess/xml使用はスクリプトの性質上必要（内部コマンドのみ）。
    "suspicious-subprocess-import", "suspicious-xml-etree-import",
    # 遅延 import は循環インポート回避のために意図的に使用。
    "import-outside-top-level",
    # print はスクリプトの進捗出力・報告として意図的。
    "print",
    # Any 型は外部ライブラリの型付け困難箇所でのみ使用。
    "any-type",
    # F401: 存在確認のための import（ImportError フォールバック用）。
    "unused-import",
    # SQL は内部信頼データのみ対象。
    "hardcoded-sql-expression",
    # subprocess は内部コマンドのみ起動。フルパス指定は要求しない。
    "subprocess-without-shell-equals-true", "start-process-with-partial-path",
    # ERA001: 日本語コメントがコードと誤検出される。
    "commented-out-code",
    # S101: assert はパーサの不変条件確認に使用。
    "assert",
    # S105: 環境変数キー名（パスワードそのものではない）。
    "hardcoded-password-string",
    # SIM115: NamedTemporaryFile は delete=False のため context manager 不可。
    "open-file-with-context-handler",
    # E501: 多言語文字列リテラル・docstring は機械的な折り返しで可読性が損なわれる。
    "line-too-long",
    # DTZ005: アーカイブファイル名はローカル時刻で命名する（ユーザ向けタイムスタンプ）。
    "call-datetime-now-without-tzinfo",
]
# 日本語テキストでの全角括弧・等号は意図的（RUF001/002/003 の誤検出除外）。
allowed-confusables = ["\uff08", "\uff09", "\uff1d"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "undocumented-public-module",    # テストモジュールに docstring を要求しない
    "undocumented-public-function",    # テスト関数に docstring を要求しない
    "magic-value-comparison", # テストの assert で数値リテラルを使ってよい
    "assert",    # assert 文を pytest で使う
    "import-private-name", # プライベートヘルパー関数のインポートを許容する
    "typing-only-standard-library-import",  # テストでの標準ライブラリの型インポートチェックをスキップする
    "typing-only-third-party-import",   # テストでのサードパーティ型インポートチェックをスキップする(pytest 等)
    "private-member-access",  # テストからプライベートメンバ (_xxx) へのアクセスを許容する
    "unused-function-argument",  # テスト用 fake/モック関数の未使用引数を許容する
    "unused-async",    # テスト用 async generator ダブルは await しない
]
"ame_ai_review_system/*.py" = [
    "implicit-namespace-package",  # 単体実行のためパッケージ化不要
    "undocumented-public-module",    # スタンドアロンスクリプトのためモジュール docstring 不要
    "undocumented-public-function",
]
"scripts/*.py" = [
    "implicit-namespace-package",  # 単体実行のためパッケージ化不要
    "undocumented-public-function",
]
"ame_ai_review_system/pr_streak.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/main.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/github_client.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/reply.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
preview = true

# ---------------------------------------------------------------------------
# mypy: 静的型検査（strict + 追加厳格化）。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "unused-awaitable",
    "mutable-override",
    "comparison-overlap",
]
disable_error_code = ["untyped-decorator", "type-arg"]
namespace_packages = true
explicit_package_bases = false
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "claude_agent_sdk.*",
    "google.*",
    "pytest",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest: 単体テスト（将来のテスト追加に備えて設定を保持）。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = ["ame-ai-review-system", "scripts"]
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# codespell: 綴りミス検出（コード・コメント・ドキュメント横断）。
# ---------------------------------------------------------------------------
[tool.codespell]
skip = '*/vendor/*,*.min.js,*.min.css,*.zip,*.db,*.wasm,*.sha512,*.lock,package-lock.json'
ignore-words-list = "nd"
check-filenames = true

# ---------------------------------------------------------------------------
# pyright: 静的型検査設定。
# ---------------------------------------------------------------------------
[tool.pyright]
extraPaths = ["ame_ai_review_system", "scripts"]
