# AME-AI-Review-System プロジェクト定義 ＋ ツール設定。
#
# 配布方式: GitHub Release のタグ付き wheel を pip install する（PyPI 非公開）。
# バージョンは ame_ai_review_system/__init__.py の __version__ を正とし、
# hatchling が動的読み込みする。コアは依存ゼロ・標準ライブラリのみで動作。
# 開発用の SDK 依存は requirements-dev.txt で管理する。
# 静的解析ツール設定は後半に保持。厳格度: ruff ALL + preview + mypy strict で運用。

# ---------------------------------------------------------------------------
# Build system (hatchling)
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "ame-ai-review-system"
dynamic = ["version"]
description = "Dual-gate (pre-commit + PR) AI code review system with SDK-backed LLM engines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tarmin Japan" }]
keywords = ["code-review", "pre-commit", "llm", "claude", "opencode", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

# LLM エンジン SDK は使用エンジンに応じて optional extras で導入できる。
# 既定は依存ゼロ（標準ライブラリのみ）で軽量配布を維持する。
# PyPI 非公開のため extras は direct URL 構文を使う:
#   pip install "ame-ai-review-system[claude] @ <wheel-url>"
# または個別に pip install claude-agent-sdk でもよい (README 推奨手順)。
# OpenCode / Claude-TS は TypeScript SDK を使うため npm 別途導入が必要
# (engines/ts/ の package.json。Phase 2 で初回 npm install を自動化予定)。
[project.optional-dependencies]
claude = ["claude-agent-sdk"]
antigravity = ["google-antigravity"]
all = ["claude-agent-sdk", "google-antigravity"]

[project.urls]
Homepage = "https://github.com/AME-Team/AME-AI-Review-System"
Repository = "https://github.com/AME-Team/AME-AI-Review-System"
Issues = "https://github.com/AME-Team/AME-AI-Review-System/issues"

# ---------------------------------------------------------------------------
# Console scripts (CLI entry point)
# ---------------------------------------------------------------------------
# 従来の `python -m ame_ai_review_system.main` も後方互換で動く。
# pip install 後は `ame-ai-reviewer review <PR>` 等で呼べる。
[project.scripts]
ame-ai-reviewer = "ame_ai_review_system.main:main"

# ---------------------------------------------------------------------------
# Hatchling build configuration
# ---------------------------------------------------------------------------
# バージョン正は ame_ai_review_system/__init__.py の __version__。
[tool.hatch.version]
path = "ame_ai_review_system/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ame_ai_review_system"]

# 開発者が engines/ts/ で npm install すると node_modules ができる。
# これが wheel に混入すると肥大化するため除外する。
exclude = ["ame_ai_review_system/engines/ts/node_modules"]

# 非 Python アセット（Semgrep ルール・TS サイドカー・テンプレート・設定ファイル）は
# packages 指定で ame_ai_review_system/ 以下の全ファイルが自動的に wheel に含まれる。
# .py 以外も（.semgrep/rules.yml, config.json, review_prompt.txt, docs/, engines/ts/,
# templates/ 等）含まれるため、force-include は不要。
#
# Issue #111: review_prompt.txt は init が .ame-review/ へコピーする単一情報源。
# wheel に同梱されないと init が fail-fast (exit 1) するため、収録は必須。
# 同梱を保証するため、将来 packages 指定を変更する場合は必ず以下を維持すること。

[tool.hatch.build.targets.sdist]
# CI は uv / npm のキャッシュをワークスペース直下 .cache/ に置く。
# .gitignore で除外しているが、ignore-vcs 等で防御が失われても
# 数 GB のキャッシュが sdist に混入しないよう明示的に除外する。
exclude = [".cache"]

# ---------------------------------------------------------------------------
# Ruff: lint + format（超厳格）
# ---------------------------------------------------------------------------
# Ruff: lint + format（超厳格）
#   方針: 全ルール(ALL)を有効化。preview ルールも有効化する。
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 88
src = [
    "ame_ai_review_system",
    "scripts",
]
# 抑制コメント検出スクリプトは # noqa / # ruff: noqa パターンを
# データとして保持するため、ruff のチェック・フォーマット対象外とする。
extend-exclude = [
    "scripts/precommit_hygiene.py",
]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    # 著作権表示はプロジェクト慣習なし。
    "missing-copyright-notice",
    # COM812 は ruff format と競合するため無効化 (formatter 側でカンマを制御)。
    "missing-trailing-comma",
    # Return/yield/例外をすべてdocstringに書くことは要求しない。
    "docstring-missing-returns", "docstring-missing-yields", "docstring-missing-exception",
    # ドメインロジックの大関数（分割はスコープ外）。
    "complex-structure", "too-many-branches", "too-many-locals", "too-many-statements", "too-many-return-statements", "too-many-arguments", "too-many-positional-arguments",
    # tryブロック内の文数制限。
    "too-many-statements-in-try-clause",
    # subprocess/xml使用はスクリプトの性質上必要（内部コマンドのみ）。
    "suspicious-subprocess-import", "suspicious-xml-etree-import",
    # 遅延 import は循環インポート回避のために意図的に使用。
    "import-outside-top-level",
    # print はスクリプトの進捗出力・報告として意図的。
    "print",
    # Any 型は外部ライブラリの型付け困難箇所でのみ使用。
    "any-type",
    # F401: 存在確認のための import（ImportError フォールバック用）。
    "unused-import",
    # SQL は内部信頼データのみ対象。
    "hardcoded-sql-expression",
    # subprocess は内部コマンドのみ起動。フルパス指定は要求しない。
    "subprocess-without-shell-equals-true", "start-process-with-partial-path",
    # ERA001: 日本語コメントがコードと誤検出される。
    "commented-out-code",
    # S101: assert はパーサの不変条件確認に使用。
    "assert",
    # S105: 環境変数キー名（パスワードそのものではない）。
    "hardcoded-password-string",
    # SIM115: NamedTemporaryFile は delete=False のため context manager 不可。
    "open-file-with-context-handler",
    # E501: 多言語文字列リテラル・docstring は機械的な折り返しで可読性が損なわれる。
    "line-too-long",
    # DTZ005: アーカイブファイル名はローカル時刻で命名する（ユーザ向けタイムスタンプ）。
    "call-datetime-now-without-tzinfo",
]
# 日本語テキストでの全角括弧・等号は意図的（RUF001/002/003 の誤検出除外）。
allowed-confusables = ["\uff08", "\uff09", "\uff1d"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "undocumented-public-module",    # テストモジュールに docstring を要求しない
    "undocumented-public-function",    # テスト関数に docstring を要求しない
    "magic-value-comparison", # テストの assert で数値リテラルを使ってよい
    "assert",    # assert 文を pytest で使う
    "import-private-name", # プライベートヘルパー関数のインポートを許容する
    "typing-only-standard-library-import",  # テストでの標準ライブラリの型インポートチェックをスキップする
    "typing-only-third-party-import",   # テストでのサードパーティ型インポートチェックをスキップする(pytest 等)
    "private-member-access",  # テストからプライベートメンバ (_xxx) へのアクセスを許容する
    "unused-function-argument",  # テスト用 fake/モック関数の未使用引数を許容する
    "unused-async",    # テスト用 async generator ダブルは await しない
]
"ame_ai_review_system/*.py" = [
    "implicit-namespace-package",  # 単体実行のためパッケージ化不要
    "undocumented-public-module",    # スタンドアロンスクリプトのためモジュール docstring 不要
    "undocumented-public-function",
]
"scripts/*.py" = [
    "implicit-namespace-package",  # 単体実行のためパッケージ化不要
    "undocumented-public-function",
]
"ame_ai_review_system/pr_streak.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/main.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/github_client.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/reply.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub API (api.github.com) へのアクセスは許容
]
"ame_ai_review_system/init_cmd.py" = [
    "suspicious-url-open-usage",    # URL open 検査: GitHub Release API (api.github.com) の sha256 解決は許容
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
preview = true

# ---------------------------------------------------------------------------
# mypy: 静的型検査（strict + 追加厳格化）。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "unused-awaitable",
    "mutable-override",
    "comparison-overlap",
]
disable_error_code = ["untyped-decorator", "type-arg"]
namespace_packages = true
explicit_package_bases = false
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "claude_agent_sdk.*",
    "google.*",
    "pytest",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest: 単体テスト（将来のテスト追加に備えて設定を保持）。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = ["ame-ai-review-system", "scripts"]
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# codespell: 綴りミス検出（コード・コメント・ドキュメント横断）。
# ---------------------------------------------------------------------------
[tool.codespell]
skip = '*/vendor/*,*.min.js,*.min.css,*.zip,*.db,*.wasm,*.sha512,*.lock,package-lock.json'
ignore-words-list = "nd"
check-filenames = true

# ---------------------------------------------------------------------------
# pyright: 静的型検査設定。
# ---------------------------------------------------------------------------
[tool.pyright]
extraPaths = ["ame_ai_review_system", "scripts"]
