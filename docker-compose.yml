# Gitea Actions Runner (act_runner デーモン)
---
# gitea/act_runner 公式イメージでランナーデーモンを Docker 起動する。
# Gitea が WSL 上で動いているため、host.docker.internal ではなく WSL2 IP を使う。
#
# 使い方:
#   1. ジョブ実行イメージをビルド (初回のみ):
#        docker build -t ame-ai-review-runner:latest .
#
#   2. Gitea UI (Site Administration → Actions → Runners) で登録トークンを取得
#
#   3. 起動 (WSL2 IP を自動検出):
#        RUNNER_REGISTRATION_TOKEN=<トークン> ./start-runner.sh
#
#   4. 以降の起動はトークン不要 (登録情報は runner_data ボリュームに永続化):
#        ./start-runner.sh

services:
  runner:
    image: gitea/act_runner:latest
    container_name: act-runner
    environment:
      # WSL2 IP は start-runner.sh が自動設定する (GITEA_INSTANCE_URL)。
      # 手動実行する場合は環境変数で上書き可能。
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: local-runner
      GITEA_RUNNER_LABELS: ubuntu-latest:docker://ame-ai-review-runner:latest
      GITEA_RUNNER_INSECURE: "true"
      CONFIG_FILE: /config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_data:/data
      - ./runner-config.yaml:/config.yaml:ro
    restart: unless-stopped
    networks:
      - runner-net

volumes:
  runner_data:

networks:
  runner-net:
    # WSL2 のサブネット (172.18.0.0/16) と衝突すると Gitea に到達できないため、
    # 異なるサブネットを明示的に指定する。job コンテナ (runner-config.yaml の
    # container.network) にも同名を指定して同じネットワークに乗せる。
    name: runner-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
