---
# AME AI Review System — pre-commit profile: text
# ドキュメント/文章の静的解析 (codespell / markdownlint / textlint) + AI レビューフック。
# markdownlint-cli2 / textlint は Node.js ツールのため、依存リポジトリが提供する
# pre-commit マニフェストに依存せず language: system のローカルフックで ./node_modules/.bin/*
# を直接起動する。実行にはプロジェクト側で npm install しておくこと。
#
# 検証済みバージョン（package.json の devDependencies 例）:
#   "markdownlint-cli2": "^0.23.1"
#   "textlint": "^14.0.0"
#   "textlint-rule-preset-ja-technical-writing": "^12.0.0"
# consumer 側で上記以上のバージョンを導入すれば動作する（major 行き来は非保証）。
minimum_pre_commit_version: "4.0.0"
# Issue #82: ai-review-state-reset (stages: [post-commit]) が standard install で
# 入るよう post-commit を明示する。既存クローンで pre-commit install 済みの場合は
#   pre-commit install -t pre-commit -t post-commit
# を再実行すること。
default_install_hook_types: [pre-commit, post-commit]
fail_fast: true

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell

  - repo: local
    hooks:
      # igorshubovych/markdownlint-cli には markdownlint-cli2 id が存在せず、
      # textlint/textlint には .pre-commit-hooks.yaml 自体が無いためローカルフック化。
      # types: [markdown] を指定しないと pass_filenames デフォルト挙動でも
      # pre-commit run --all-files 時に走査対象が不明で silently skip する (Issue #52 #7)。
      - id: markdownlint-cli2
        name: markdownlint-cli2 (Markdown)
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
        pass_filenames: true

      - id: textlint
        name: textlint (Japanese prose)
        entry: ./node_modules/.bin/textlint --fix
        language: system
        types: [markdown]
        pass_filenames: true

  # =========================================================================
  # AME AI Review System — Gate 1 AI review hooks
  # pre-commit が `language: python` の venv へ wheel を自動導入するため、
  # 絶対パスのハードコードは不要 (各環境で解決される)。初回実行時のみ
  # GitHub Releases の wheel 取得にネットワークが必要 (以降はキャッシュ)。
  # オフライン/制限環境では `ame-ai-reviewer init --python <path>` を使うと
  # `language: system` で生成され、事前に導入した Python で実行される。
  # 供給チェーン対策として wheel は `#sha256=` で内容を固定する (Issue #84)。
  # =========================================================================
  - repo: local
    hooks:
      - id: ai-skip-guard
        name: "AI review skip guard (Issue #26)"
        entry: __AI_HOOK_ENTRY__ame_ai_review_system.skip_guard
        language: __AI_LANGUAGE__
        additional_dependencies: __AI_ADDEPS_ANCHOR__
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-precommit-review
        name: "AI Code Review (pre-commit)"
        entry: __AI_HOOK_ENTRY__ame_ai_review_system.precommit_review
        language: __AI_LANGUAGE__
        additional_dependencies: __AI_ADDEPS_REF__
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-review-state-reset
        name: "AI review state reset (post-commit)"
        entry: __AI_HOOK_ENTRY__ame_ai_review_system.post_commit_reset
        language: __AI_LANGUAGE__
        additional_dependencies: __AI_ADDEPS_REF__
        pass_filenames: false
        always_run: true
        stages: [post-commit]
