---
# AME AI Review System — pre-commit profile: ts
# Node/TypeScript 静的解析 (eslint / tsc / prettier / stylelint / codespell / yamllint)
# + AI レビューフック。eslint/tsc/prettier/stylelint はプロジェクトローカルの
# node_modules/.bin を直接起動するため、事前に npm install (または pnpm/yarn install) が
# 必要。tsc は tsconfig.json が型チェック向けでないと無関係エラーが噛むため、
# デフォルトでは eslint のみ有効化し tsc はコメントアウトしてある (Issue #69)。
minimum_pre_commit_version: "4.0.0"
# Issue #82: ai-review-state-reset (stages: [post-commit]) が standard install で
# 入るよう post-commit を明示する。既存クローンで pre-commit install 済みの場合は
#   pre-commit install -t pre-commit -t post-commit
# を再実行すること。
default_install_hook_types: [pre-commit, post-commit]
fail_fast: true

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # Issue #69: lockfile の圧縮トークンを typo と誤検知するため除外。
        # Issue #80: .ame-review/engines-ts/ (TS 側エンジン SDK) も誤検知回避のため除外。
        exclude: "(pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock)$|^\\.ame-review/engines-ts/"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--strict]
        # Issue #69: lockfile (数千行・長行) は yamllint --strict で大量エラーになるため除外。
        exclude: "(pnpm-lock\\.yaml|.*-lock\\.(yaml|json)|yarn\\.lock)$"

  - repo: local
    hooks:
      # eslint はフラット設定 (eslint.config.mjs) または .eslintrc のどちらでも動く。
      - id: eslint
        name: eslint (TypeScript)
        entry: ./node_modules/.bin/eslint --max-warnings=0 --no-warn-ignored
        language: system
        # types: [ts] は .tsx を対象外にするため types_or で両対応する (Issue #69)。
        types_or: [ts, tsx]
        pass_filenames: true

      # tsc は tsconfig が型チェック向け (noEmit 等) の場合のみ有効化すること。
      # ルート tsconfig がソリューション参照型だと無関係な既存エラーが表面化する。
      # 必要ならコメントを外して -p で型チェック用 tsconfig を明示すること。
      # - id: tsc
      #   name: tsc (type check)
      #   entry: ./node_modules/.bin/tsc --noEmit
      #   language: system
      #   pass_filenames: false
      #   files: \.(ts|tsx)$

      - id: prettier
        name: prettier (format check)
        entry: ./node_modules/.bin/prettier --check
        language: system
        types_or: [ts, tsx, js, jsx, json, css, scss, yaml, markdown]
        # Issue #69: lockfile は整形規則と一致しないため除外。
        exclude: "(pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock)$"
        pass_filenames: true

      - id: stylelint
        name: stylelint (CSS)
        entry: ./node_modules/.bin/stylelint
        language: system
        types_or: [css, scss]
        pass_filenames: true

  # =========================================================================
  # AME AI Review System — Gate 1 AI review hooks
  # pre-commit が `language: python` の venv へ wheel を自動導入するため、
  # 絶対パスのハードコードは不要 (各環境で解決される)。初回実行時のみ
  # GitHub Releases の wheel 取得にネットワークが必要 (以降はキャッシュ)。
  # オフライン/制限環境では `ame-ai-reviewer init --python <path>` を使うと
  # `language: system` で生成され、事前に導入した Python で実行される。
  # 供給チェーン対策として wheel は `#sha256=` で内容を固定する (Issue #84)。
  # =========================================================================
  - repo: local
    hooks:
      - id: ai-skip-guard
        name: "AI review skip guard (Issue #26)"
        entry: __AI_HOOK_ENTRY__ame_ai_review_system.skip_guard
        language: __AI_LANGUAGE__
        additional_dependencies: __AI_ADDEPS__
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-precommit-review
        name: "AI Code Review (pre-commit)"
        entry: __AI_HOOK_ENTRY__ame_ai_review_system.precommit_review
        language: __AI_LANGUAGE__
        additional_dependencies: __AI_ADDEPS__
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ai-review-state-reset
        name: "AI review state reset (post-commit)"
        entry: __AI_HOOK_ENTRY__ame_ai_review_system.post_commit_reset
        language: __AI_LANGUAGE__
        additional_dependencies: __AI_ADDEPS__
        pass_filenames: false
        always_run: true
        stages: [post-commit]
