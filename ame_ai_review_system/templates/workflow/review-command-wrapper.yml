---
# AME AI Review System — PR レビュー呼び出しラッパ (配布先用)。
# `ame-ai-reviewer init` で生成される。__REF__ はリリースタグ (例: v1.0.0) に置換される。
# 更新は __REF__ の差し替えのみ。本体は reusable workflow 側を参照する。

name: AI Code Review (Command)

"on":
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "レビュー対象 PR 番号（手動実行時）"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: tarminjapan/AME-AI-Review-System/.github/workflows/review-command.yml@__REF__
    with:
      pr_number: ${{ inputs.pr_number || github.event.issue.number }}
      command: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      system_ref: __REF__
      review_engine: ${{ vars.REVIEW_ENGINE || 'opencode' }}
      review_model: ${{ vars.REVIEW_MODEL || '' }}
      reply_model: ${{ vars.REPLY_MODEL || '' }}
      review_thinking: ${{ vars.REVIEW_THINKING || '' }}
    secrets:
      app-id: ${{ secrets.AME_AI_REVIEWER_APP_ID }}
      private-key: ${{ secrets.AME_AI_REVIEWER_APP_PRIVATE_KEY }}
      opencode-auth-b64: ${{ secrets.OPENCODE_AUTH_B64 }}
      antigravity-oauth-b64: ${{ secrets.ANTIGRAVITY_OAUTH_B64 }}
      gemini-oauth-b64: ${{ secrets.GEMINI_OAUTH_B64 }}
