---
# 再利用可能ワークフロー: /request-review (エイリアス /review) コマンドで PR レビューを実行する本体。
#
# 配布先は薄いラッパ (templates/workflow/review-command-wrapper.yml) から
#   uses: AME-Team/AME-AI-Review-System/.github/workflows/review-command.yml@<ref>
# で呼び出す。更新は @<ref> の差し替えのみ。
#
# 本リポジトリ自身は .github/workflows/review_command.yml (ラッパ) から
#   uses: ./.github/workflows/review-command.yml (ローカル参照, system_ref 空)
# で呼び出す。同一リポジトリ内の reusable 呼び出しはローカル参照を使う (GitHub 制約)。
#
# エンジン情報 (engine/model/thinking) は配布先の vars 由来の inputs、
# 認証情報は配布先の Actions secrets 由来の secrets で受け取る。
# system_ref が指定されていれば AME-AI-Review-System を checkout して利用し、
# 空 (ローカル参照) なら呼び出し元リポジトリのルートをそのまま利用する。

name: AI Code Review (Reusable Command)

"on":
  workflow_call:
    inputs:
      # Issue #104: workflow_dispatch の inputs は常に文字列のため、ラッパが
      # fromJSON に依存しなくても動作するよう type: string で受け取り、内部の
      # CLI (argparse type=int / int()) で数値へキャストする。
      pr_number:
        type: string
        required: true
      command:
        type: string
        required: false
        default: ""
      system_ref:
        type: string
        required: false
        default: ""
      review_engine:
        type: string
        required: false
        default: "opencode"
      review_model:
        type: string
        required: false
        default: ""
      reply_model:
        type: string
        required: false
        default: ""
      review_thinking:
        type: string
        required: false
        default: ""
      # 実行ランナー (JSON 配列)。既定は GitHub-hosted で、配布先の挙動を変えない。
      # hub 自身はセルフホストを指定する。
      runner_labels:
        type: string
        required: false
        default: '["ubuntu-latest"]'
    secrets:
      app-id:
        required: true
      private-key:
        required: true
      opencode-auth-b64:
        required: false
      antigravity-oauth-b64:
        required: false
      gemini-oauth-b64:
        required: false
      review-engine:
        required: false
      review-model:
        required: false
      reply-model:
        required: false
      review-thinking:
        required: false

permissions:
  contents: read
  pull-requests: write
  # Issue #140: GITHUB_TOKEN で HEAD SHA の check runs を読む (App 権限に依存しない)。
  checks: read

jobs:
  guard:
    name: Guard fork pull requests
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      # セルフホストランナーでは PR のコードがこのマシン上で動く。public リポジトリなので、
      # fork からの PR は checkout より前に弾く (curl だけに依存させ、gh の有無に左右されない)。
      - name: Reject fork pull requests
        id: check
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          for cmd in curl python3; do
            if ! command -v "${cmd}" >/dev/null 2>&1; then
              echo "::error::${cmd} がランナーにありません (self-hosted の前提を確認してください)。"
              exit 1
            fi
          done
          if [ -z "${PR_NUMBER}" ]; then
            # PR 番号が無いまま実行すると fork 判定ができない。安全側 (実行しない) に倒す。
            echo "::warning::PR 番号が解決できないためレビューをスキップします。"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_repo=$(curl -fsSL \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/${REPO}/pulls/${PR_NUMBER}" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["head"]["repo"]; \
              print(r["full_name"] if r else "")')
          if [ "${head_repo}" = "${REPO}" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            # head repo を特定できない (fork 削除済みなど) 場合も安全側に倒す。

            echo "::warning::fork からの PR (${head_repo}) のためレビューをスキップします。"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Review on /request-review (ame-ai-reviewer)
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # ツール導入 (最大 600 秒) + opencode サーバの自己終了 (480 秒) + kill-after (30 秒) の
    # 1110 秒に、checkout / engine 依存の導入 / 終了処理の余裕 (690 秒) を足して 30 分。
    timeout-minutes: 30
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AME-AI-Review-System (external)
        if: inputs.system_ref != ''
        uses: actions/checkout@v4
        with:
          repository: AME-Team/AME-AI-Review-System
          ref: ${{ inputs.system_ref }}
          path: ame-review-system
          fetch-depth: 1

      - name: Resolve system path
        id: syspath
        run: |
          if [ -n "${{ inputs.system_ref }}" ]; then
            echo "path=${{ github.workspace }}/ame-review-system" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore engine credentials
        run: |
          mkdir -p ~/.local/share/opencode ~/.gemini/antigravity-cli
          echo "${{ secrets.opencode-auth-b64 }}" | base64 -d > ~/.local/share/opencode/auth.json
          AGY_TOKEN=~/.gemini/antigravity-cli/antigravity-oauth-token
          echo "${{ secrets.antigravity-oauth-b64 }}" | base64 -d > "$AGY_TOKEN"
          echo "${{ secrets.gemini-oauth-b64 }}" | base64 -d > ~/.gemini/oauth_creds.json
          chmod 600 ~/.local/share/opencode/auth.json "$AGY_TOKEN" ~/.gemini/oauth_creds.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Python はランナーにあるものを使う。actions/setup-python は Linux Mint を認識できず
      # 失敗するため使わない (GitHub-hosted の ubuntu-latest も python3 3.12 を同梱している)。
      # 前提 (python3 3.10 以上 / venv / uv) は docs/setup.md に記載している。
      - name: Verify Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'

      - name: Install Python engine SDKs
        env:
          REVIEW_ENGINE: ${{ inputs.review_engine || secrets.review-engine || 'opencode' }}
        run: |
          if [ "$REVIEW_ENGINE" = "opencode" ]; then
            echo "Engine is opencode; Python SDKs not required."
            exit 0
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system --python "$(command -v python3)" \
            claude-agent-sdk google-antigravity

      - name: Install OpenCode CLI
        run: |
          # self-hosted の npm prefix が /usr の場合に備え、ユーザー領域へ入れる
          # (npm config は ~/.npmrc を書き換えるので --prefix を都度渡す)。
          npm install -g --prefix "${RUNNER_TEMP}/npm" opencode-ai
          echo "${RUNNER_TEMP}/npm/bin" >> "$GITHUB_PATH"

      - name: Determine whether to run
        id: cmd
        env:
          SYSTEM_PATH: ${{ steps.syspath.outputs.path }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_BODY: ${{ inputs.command }}
        run: |
          if [ -z "$COMMENT_BODY" ]; then
            RUN_REVIEW="true"
          else
            RUN_REVIEW=$(PYTHONPATH="$SYSTEM_PATH" python3 -m ame_ai_review_system.review_config \
              is-review-command "$COMMENT_BODY")
          fi
          echo "run_review=${RUN_REVIEW}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Get GitHub App installation token
        id: app_token
        if: steps.cmd.outputs.run_review == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Switch to PR branch
        if: steps.cmd.outputs.run_review == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cmd.outputs.pr_number }}
          GITHUB_PAT_TOKEN: ${{ steps.app_token.outputs.token }}
          SYSTEM_PATH: ${{ steps.syspath.outputs.path }}
        run: |
          PYTHONPATH="$SYSTEM_PATH" python3 -m ame_ai_review_system.main checkout "$PR_NUMBER"

      # pre-commit の language: system フックは PATH 上のツールを直接起動する。セルフホストの
      # ランナーには mypy / pyright / node_modules が無く、Circuit Breaker が毎回失敗して
      # レビューが無言でスキップされる。lockfile を持つリポジトリでは ci.yml と同じ
      # ツールチェーン (venv / node_modules) を用意する。
      # GITHUB_ENV / GITHUB_PATH の反映は後続ステップからなので、このステップは Circuit Breaker を
      # 実行する "Run General Review" より前でなければならない (順序を入れ替えないこと)。
      - name: Install dev toolchain for static pre-check
        if: steps.cmd.outputs.run_review == 'true'
        # 導入が遅いだけでレビューごと落とさない。ツールが揃わなければ Circuit Breaker が
        # 失敗し、理由を出してスキップする経路に乗る。
        # 各コマンドの timeout の合計は 600 秒 (120 + 60 + 180 + 240)。ジョブ上限 30 分
        # (1800 秒) から opencode サーバの 480 秒・--kill-after (30 秒)・その他のステップを
        # 引いても余裕が残る。
        continue-on-error: true
        run: |
          set -euo pipefail
          # `if ! install_python_tools` の条件文脈では set -e が無効になる。失敗を握り潰すと
          # 警告も出ないままツール未導入になるため、各所で明示的に伝播する。
          install_python_tools() {
            if [ ! -f requirements-dev.txt ]; then
              # フックが自己完結 (language: python 等) なら何も要らない。system フックが残って
              # いる場合だけ、ツール不在で Circuit Breaker が失敗し続けることを警告する。
              if grep -q "language: system" .pre-commit-config.yaml 2>/dev/null; then
                msg="requirements-dev.txt が無いのに language: system のフックがあります。"
                msg="${msg} mypy / pyright 等が PATH に無いと Circuit Breaker が失敗します。"
                echo "::warning::${msg}"
              fi
              return 0
            fi
            # セルフホストのランナーには uv が入っていることがある。毎回ダウンロードしない。
            # 取得元は版を固定する (install.sh は引数なしだと最新を取る)。
            if command -v uv >/dev/null 2>&1; then
              echo "uv は既にあります: $(command -v uv)"
            else
              UV_VERSION="0.12.1"
              timeout 120 bash -o pipefail -c \
                "curl -LsSf 'https://astral.sh/uv/${UV_VERSION}/install.sh' | sh" || return 1
            fi
            export PATH="$HOME/.local/bin:$PATH"
            # --clear: 前回の RUNNER_TEMP が残っていても確実に作り直す。
            timeout 60 uv venv --clear "${RUNNER_TEMP}/dev-venv" \
              --python "$(command -v python3)" || return 1
            timeout 180 uv pip install --python "${RUNNER_TEMP}/dev-venv/bin/python" \
              -r requirements-dev.txt || return 1
            # pyrightconfig.json の venvPath / venv は .venv を指す。venv は RUNNER_TEMP に作る。
            # PR が実体の .venv を持ち込んでも、pyright に PR 側の Python を実行させないよう
            # 常に張り替える (この checkout はジョブ専用で、下流の作業ツリーには影響しない)。
            rm -rf "${GITHUB_WORKSPACE}/.venv" || return 1
            ln -sfn "${RUNNER_TEMP}/dev-venv" "${GITHUB_WORKSPACE}/.venv" || return 1
            # venv の bin をそのまま PATH へ足すと python3 / pip が差し替わり、engine 側の
            # Python SDK (system python へ入れたもの) を見失う。実行系とパッケージ操作系は除く。
            mkdir -p "${RUNNER_TEMP}/dev-bin" || return 1
            for entry in "${RUNNER_TEMP}/dev-venv/bin"/*; do
              name="$(basename "$entry")"
              case "$name" in
                python* | pip* | activate* | Activate*) continue ;;
              esac
              ln -sf "$entry" "${RUNNER_TEMP}/dev-bin/${name}" || return 1
            done
          }
          if ! install_python_tools; then
            msg="Python ツールチェーンの導入に失敗しました。"
            msg="${msg} language: system のフックは失敗します (理由は静的解析のログに出ます)。"
            echo "::warning::${msg}"
          fi
          # node の system フックは `./node_modules/.bin/<tool>` を直接起動する。entry の書き方は
          # 導入先ごとに違い (コマンド名だけの構成もある)、文字列で判定すると取りこぼすため
          # lockfile の有無だけで用意する。PATH は変えず、相対パスの実体だけを置く。
          # --ignore-scripts: PR 側 package.json の postinstall をセルフホストで実行させない。
          if [ -f package.json ] && [ -f package-lock.json ]; then
            if ! timeout 240 npm ci --ignore-scripts --no-audit --no-fund; then
              msg="npm ci に失敗しました。node の system フックは失敗します"
              msg="${msg} (理由は静的解析のログに出ます)。"
              echo "::warning::${msg}"
            fi
          fi
          # PATH へは dev-bin だけを足す (mypy / pyright 等は system に無い)。
          # node_modules/.bin は意図的に PATH へ載せない (PR 側のバイナリを信頼済みツールとして
          # 実行させない)。現在の後続ステップが呼ぶのは opencode (RUNNER_TEMP/npm/bin 経由) と
          # python3 だけで、bare な node ツール呼び出しは無い。今後 node ツールを使うステップを
          # 足すときは ./node_modules/.bin/<tool> と明示パスで呼ぶこと。
          echo "${RUNNER_TEMP}/dev-bin" >> "$GITHUB_PATH"

      - name: Start OpenCode server
        if: steps.cmd.outputs.run_review == 'true'
        run: |
          set -euo pipefail
          # 空きポートを取ってから起動するまでに他プロセスが掴むことはあり得る。起動に
          # 失敗したら別ポートで数回やり直し、全滅したら明示的に失敗させる。
          for attempt in 1 2 3; do
            port=$(python3 -c 'import socket; s=socket.socket(); \
              s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
            log="${RUNNER_TEMP}/opencode-server.${port}.log"
            # ジョブが強制終了されると Stop が走らずサーバが残る。ジョブ上限は 30 分
            # (1800 秒) で、ツール導入 (最大 600 秒) と --kill-after (30 秒) を引いても
            # 1170 秒残る。その範囲に収まる 480 秒で必ず終わるようにする。
            # 他ジョブが使う共有ディレクトリの PID を掃除する方式は採らない (並行実行中の
            # サーバを止めてしまうため)。ここで完結させる。
            timeout --signal=TERM --kill-after=30s 480 \
              opencode serve --port "${port}" > "${log}" 2>&1 &
            pid=$!
            ready=0
            for _ in $(seq 1 30); do
              if grep -q "opencode server listening" "${log}" 2>/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "${pid}" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [ "${ready}" -eq 1 ]; then
              echo "${pid}" > "${RUNNER_TEMP}/opencode.pid"
              echo "OPENCODE_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::opencode サーバの起動に失敗しました (attempt=${attempt}, port=${port})" >&2
            tail -n 20 "${log}" >&2 || true
            echo "${pid}" | xargs -r kill -15 2>/dev/null || true
          done
          echo "::error::opencode サーバを起動できませんでした。"
          exit 1

      - name: Run General Review
        if: steps.cmd.outputs.run_review == 'true'
        env:
          AME_AI_REVIEWER_TOKEN: ${{ steps.app_token.outputs.token }}
          # Issue #140: check runs 読み取り専用トークン。App 権限に依存せず GITHUB_TOKEN で担保する。
          AME_REVIEW_CHECKS_TOKEN: ${{ github.token }}
          REVIEWER_NAME: ame-ai-reviewer
          PR_NUMBER: ${{ steps.cmd.outputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_ENGINE: ${{ inputs.review_engine || secrets.review-engine || 'opencode' }}
          REVIEW_MODEL: ${{ inputs.review_model || secrets.review-model }}
          REPLY_MODEL: ${{ inputs.reply_model || secrets.reply-model }}
          REVIEW_THINKING: ${{ inputs.review_thinking || secrets.review-thinking }}
          OPENCODE_URL: ${{ env.OPENCODE_URL }}
          SYSTEM_PATH: ${{ steps.syspath.outputs.path }}
        run: |
          PYTHONPATH="$SYSTEM_PATH" python3 -m ame_ai_review_system.main review \
            "$PR_NUMBER"

      - name: Stop OpenCode server
        if: always()
        run: |
          pidfile="${RUNNER_TEMP}/opencode.pid"
          if [ -f "${pidfile}" ]; then
            pid=$(cat "${pidfile}")
            echo "$pid" | xargs -r kill -15
            rm -f "${pidfile}"
          fi
