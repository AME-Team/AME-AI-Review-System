---
# 再利用可能ワークフロー: インライン返信に対する LGTM/追加指摘の判断本体。
# 配布先は薄いラッパ (templates/workflow/review-reply-wrapper.yml) から
#   uses: AME-Team/AME-AI-Review-System/.github/workflows/review-reply.yml@<ref>
# で呼び出す。
# 本リポジトリ自身は review_reply.yml (ラッパ) からローカル参照で呼ぶ。
#
# 1 返信につき 1 スレッドのみ LGTM を投稿する (Issue #39)。並走実行の重複対策は
# reply.py の投稿前保留再チェックで行う。BASE_REF は checkout ステップが
# $GITHUB_ENV へ書き込む値を自然に使う。

name: AI Review Reply (Reusable)

"on":
  workflow_call:
    inputs:
      # Issue #104: pr_number / comment_id は文字列で受け取り、内部の CLI
      # (argparse type=int / reply.py の int()) で数値へキャストする。
      # 型を string に統一し、将来 dispatch 等の経路が増えても fromJSON 依存を防ぐ。
      pr_number:
        type: string
        required: true
      comment_id:
        type: string
        required: true
      comment_body:
        type: string
        required: false
        default: ""
      comment_user:
        type: string
        required: false
        default: ""
      # Issue #159: メンションを付け忘れた返信も再評価するため、返信先コメント ID を
      # 受け取る。空文字は「既存スレッドへの返信ではない」ことを表す。
      in_reply_to_id:
        type: string
        required: false
        default: ""
      system_ref:
        type: string
        required: false
        default: ""
      review_engine:
        type: string
        required: false
        default: "opencode"
      review_model:
        type: string
        required: false
        default: ""
      reply_model:
        type: string
        required: false
        default: ""
      review_thinking:
        type: string
        required: false
        default: ""
      # 実行ランナー (JSON 配列)。既定は GitHub-hosted で、配布先の挙動を変えない。
      # hub 自身はセルフホストを指定する。
      runner_labels:
        type: string
        required: false
        default: '["ubuntu-latest"]'
    secrets:
      app-id:
        required: true
      private-key:
        required: true
      opencode-auth-b64:
        required: false
      antigravity-oauth-b64:
        required: false
      gemini-oauth-b64:
        required: false
      review-engine:
        required: false
      review-model:
        required: false
      reply-model:
        required: false
      review-thinking:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  reply:
    name: General Review Reply (ame-ai-reviewer)
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 10
    # Issue #159: レビュアーのスレッドへの返信はメンション無しでも再評価する。
    # メンション必須のままだと、返信が無言で skip され LGTM が付かないまま
    # Resolve される（= 監査証跡が欠ける）。判定の最終的な絞り込みは reply.py が行う。
    # Issue #159: bare login (``ame-ai-reviewer``) で投稿される環境もあるため、両方を除外する。
    # 除外しないとレビュアー自身の LGTM 返信がジョブを起動し、重複 LGTM やループの原因になる。
    # セルフホストでは PR のコードがこのマシン上で動く。fork からの PR は実行しない。
    # PR イベント以外や head 不明のときも false になり、fail-closed になる。
    if: >-
      inputs.comment_user != 'ame-ai-reviewer[bot]' && inputs.comment_user != 'ame-ai-reviewer' &&
      !startsWith(inputs.comment_body, '/') && (contains(inputs.comment_body, '@ame-ai-reviewer') ||
      inputs.in_reply_to_id != '') && github.event.pull_request.head.repo.full_name ==
      github.repository
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AME-AI-Review-System (external)
        if: inputs.system_ref != ''
        uses: actions/checkout@v4
        with:
          repository: AME-Team/AME-AI-Review-System
          ref: ${{ inputs.system_ref }}
          path: ame-review-system
          fetch-depth: 1

      - name: Resolve system path
        id: syspath
        run: |
          if [ -n "${{ inputs.system_ref }}" ]; then
            echo "path=${{ github.workspace }}/ame-review-system" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore engine credentials
        run: |
          mkdir -p ~/.local/share/opencode ~/.gemini/antigravity-cli
          echo "${{ secrets.opencode-auth-b64 }}" | base64 -d > ~/.local/share/opencode/auth.json
          AGY_TOKEN=~/.gemini/antigravity-cli/antigravity-oauth-token
          echo "${{ secrets.antigravity-oauth-b64 }}" | base64 -d > "$AGY_TOKEN"
          echo "${{ secrets.gemini-oauth-b64 }}" | base64 -d > ~/.gemini/oauth_creds.json
          chmod 600 ~/.local/share/opencode/auth.json "$AGY_TOKEN" ~/.gemini/oauth_creds.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Python はランナーにあるものを使う。actions/setup-python は Linux Mint を認識できず
      # 失敗するため使わない (GitHub-hosted の ubuntu-latest も python3 3.12 を同梱している)。
      # 前提 (python3 3.10 以上 / venv / uv) は docs/setup.md に記載している。
      - name: Verify Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'

      - name: Install Python engine SDKs
        env:
          REVIEW_ENGINE: ${{ inputs.review_engine || secrets.review-engine || 'opencode' }}
        run: |
          if [ "$REVIEW_ENGINE" = "opencode" ]; then
            echo "Engine is opencode; Python SDKs not required."
            exit 0
          fi
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system --python "$(command -v python3)" \
            claude-agent-sdk google-antigravity

      - name: Install OpenCode CLI
        run: |
          # self-hosted の npm prefix が /usr の場合に備え、ユーザー領域へ入れる
          # (npm config は ~/.npmrc を書き換えるため、--prefix を都度渡す)。
          npm install -g --prefix "${RUNNER_TEMP}/npm" opencode-ai
          echo "${RUNNER_TEMP}/npm/bin" >> "$GITHUB_PATH"

      - name: Get GitHub App installation token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Switch to PR branch
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_PAT_TOKEN: ${{ steps.app_token.outputs.token }}
          SYSTEM_PATH: ${{ steps.syspath.outputs.path }}
        run: |
          PYTHONPATH="$SYSTEM_PATH" python3 -m ame_ai_review_system.main checkout "$PR_NUMBER"

      - name: Start OpenCode server
        run: |
          set -euo pipefail
          # 空きポートを取ってから起動するまでに他プロセスが掴むことはあり得る。起動に
          # 失敗したら別ポートで数回やり直し、全滅したら明示的に失敗させる。
          for attempt in 1 2 3; do
            port=$(python3 -c 'import socket; s=socket.socket(); \
              s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
            log="${RUNNER_TEMP}/opencode-server.${port}.log"
            # ジョブが強制終了されると Stop が走らずサーバが残る。ジョブの timeout-minutes は
            # 10 (600 秒) なので、それより短い 480 秒で必ず終わるようにする。
            # 他ジョブが使う共有ディレクトリの PID を掃除する方式は採らない (並行実行中の
            # サーバを止めてしまうため)。ここで完結させる。
            timeout --signal=TERM --kill-after=30s 480 \
              opencode serve --port "${port}" > "${log}" 2>&1 &
            pid=$!
            ready=0
            for _ in $(seq 1 30); do
              if grep -q "opencode server listening" "${log}" 2>/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "${pid}" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [ "${ready}" -eq 1 ]; then
              echo "${pid}" > "${RUNNER_TEMP}/opencode.pid"
              echo "OPENCODE_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::opencode サーバの起動に失敗しました (attempt=${attempt}, port=${port})" >&2
            tail -n 20 "${log}" >&2 || true
            echo "${pid}" | xargs -r kill -15 2>/dev/null || true
          done
          echo "::error::opencode サーバを起動できませんでした。"
          exit 1

      - name: Run reply handler
        env:
          REVIEWER_TOKEN: ${{ steps.app_token.outputs.token }}
          REVIEWER_NAME: ame-ai-reviewer
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_ENGINE: ${{ inputs.review_engine || secrets.review-engine || 'opencode' }}
          REVIEW_MODEL: ${{ inputs.review_model || secrets.review-model }}
          REPLY_MODEL: ${{ inputs.reply_model || secrets.reply-model }}
          REVIEW_THINKING: ${{ inputs.review_thinking || secrets.review-thinking }}
          OPENCODE_URL: ${{ env.OPENCODE_URL }}
          TRIGGER_COMMENT_ID: ${{ inputs.comment_id }}
          SYSTEM_PATH: ${{ steps.syspath.outputs.path }}
        run: |
          PYTHONPATH="$SYSTEM_PATH" python3 -m ame_ai_review_system.reply run "$PR_NUMBER"

      - name: Stop OpenCode server
        if: always()
        run: |
          pidfile="${RUNNER_TEMP}/opencode.pid"
          if [ -f "${pidfile}" ]; then
            pid=$(cat "${pidfile}")
            echo "$pid" | xargs -r kill -15
            rm -f "${pidfile}"
          fi
