---
# インライン返信をトリガーに、各レビュアー (Claude) が diff を読んで LGTM/追加指摘を判断する。
# 実処理は再利用可能ワークフロー review-reply.yml に委譲する (ローカル参照)。
# 1 投稿に対して LGTM は「そのスレッドだけ」に投稿する (Issue #39)。
# secrets 登録のエンジン情報 (Issue #40) も引き継ぐ。
#
# 注意 (Issue #115): 本ワークフローに concurrency を設定しないこと。
#   pull_request_review_comment イベントは返信ごとに個別の run を生成する。
#   これを concurrency.group で PR 単位にまとめると、並列投稿された後続 run が
#   cancel/skip され、bot の LGTM 応答が一部のスレッドに届かなくなる。
#   reply.py は TRIGGER_COMMENT_ID で対象スレッドを絞り込み、投稿前に再チェックして
#   並走実行の重複 LGTM を防ぐ設計のため直列化は不要である。

name: AI Review Reply

"on":
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  reply:
    uses: ./.github/workflows/review-reply.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      comment_id: ${{ github.event.comment.id }}
      comment_body: ${{ github.event.comment.body }}
      comment_user: ${{ github.event.comment.user.login }}
      review_engine: ${{ vars.REVIEW_ENGINE || '' }}
      review_model: ${{ vars.REVIEW_MODEL || '' }}
      reply_model: ${{ vars.REPLY_MODEL || '' }}
      review_thinking: ${{ vars.REVIEW_THINKING || '' }}
    secrets:
      app-id: ${{ secrets.AME_AI_REVIEWER_APP_ID }}
      private-key: ${{ secrets.AME_AI_REVIEWER_APP_PRIVATE_KEY }}
      opencode-auth-b64: ${{ secrets.OPENCODE_AUTH_B64 }}
      antigravity-oauth-b64: ${{ secrets.ANTIGRAVITY_OAUTH_B64 }}
      gemini-oauth-b64: ${{ secrets.GEMINI_OAUTH_B64 }}
      review-engine: ${{ secrets.REVIEW_ENGINE }}
      review-model: ${{ secrets.REVIEW_MODEL }}
      reply-model: ${{ secrets.REPLY_MODEL }}
      review-thinking: ${{ secrets.REVIEW_THINKING }}
